name: worker image

# Every build publishes :<commit sha>; builds from main also move :latest. A tag worker-vX.Y also
# publishes :X.Y, the version pods pin through WORKER_IMAGE. :0.1 is the first image (commit 28b3c8d);
# never tag worker-v0.1, it would overwrite it.
on:
  workflow_dispatch:
  push:
    tags: ["worker-v*"]
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/ensure_weights.py"
      - ".github/workflows/worker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/radar-worker
          {
            echo "list<<EOF"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "$image:latest"; fi
            echo "$image:${{ github.sha }}"
            if [[ "$GITHUB_REF" == refs/tags/worker-v* ]]; then echo "$image:${GITHUB_REF#refs/tags/worker-v}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/docker/Dockerfile
          platforms: linux/amd64
          # zstd layers extract several times faster than gzip on slow RunPod hosts (needs Docker 23+ there).
          outputs: type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.tags.outputs.list }}
